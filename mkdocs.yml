site_name: Big Data · Graphs · Evo · CA — Classroom
site_url: https://sgevatschnaider.github.io/BigData-Graphs-Evo-CA-Classroom/
repo_url: https://github.com/sgevatschnaider/BigData-Graphs-Evo-CA-Classroom

theme:
  name: material
  language: es
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - content.code.copy
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: lime
      toggle:
        icon: material/weather-night
        name: Modo oscuro
    - scheme: slate
      primary: indigo
      accent: lime
      toggle:
        icon: material/weather-sunny
        name: Modo claro

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - gen-files:
      scripts:
        - scripts/gen_html_gallery.py
  - section-index

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.tabbed

nav:
  - Inicio: index.md
  - Grafos:
      - Sistemas complejos y agentes de IA:
          - Introducción · Español: ai-agents/index.md
          - Introduction · English: ai-agents/index.en.md
          - Fuentes y trazabilidad: ai-agents/references.md
      - Galería de demos: gallery/index.md
      - WERC 2026 · Redes multinivel:
          - Unidad especial · Inicio: werc-2026/index.md
          - Modelo matemático: werc-2026/modelo.md
          - Ponencia y resultados: werc-2026/ponencia.md
          - Casos y finanzas de IA: werc-2026/aplicaciones.md
          - Red Queen Gödel Machine: werc-2026/coevolucion.md
          - Glosario y evaluación: werc-2026/evaluacion.md
          - Bibliografía y trazabilidad: werc-2026/referencias.md
