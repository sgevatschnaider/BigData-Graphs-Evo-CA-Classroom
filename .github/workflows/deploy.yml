name: Deploy site (MkDocs → GitHub Pages)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Materialize and verify AI-agent simulations
        run: python scripts/materialize_ai_agent_assets.py
      - name: Sanity check published assets
        run: |
          test -f docs/assets/modelo-erdos-renyi.html || { echo "Missing docs/assets/modelo-erdos-renyi.html"; exit 1; }
          for file in \
            01-emergent-protocol-en.html \
            01-emergent-protocol-es.html \
            02-collective-capability-en.html \
            02-collective-capability-es.html \
            03-attack-path-en.html \
            03-attack-path-es.html; do
            test -s "docs/assets/ai-agents/$file" || { echo "Missing AI-agent asset: $file"; exit 1; }
          done
      - name: Build MkDocs (strict)
        run: mkdocs build --strict --site-dir site
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
